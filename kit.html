<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cel Town — kit viewer</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; font: 12px/1.4 ui-sans-serif, system-ui, sans-serif; color: #22333b; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #panel { position: fixed; left: 12px; top: 12px; background: rgba(255,255,255,0.85); border: 2px solid #22333b; border-radius: 10px; padding: 8px 12px; box-shadow: 3px 3px 0 rgba(34,51,59,.25); }
      #panel label { display: block; cursor: pointer; }
      #panel i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 4px 0 2px; vertical-align: -1px; }
      .tag { font-size: 11px; background: rgba(255,255,255,.85); border: 1px solid #22333b; border-radius: 6px; padding: 1px 5px; white-space: nowrap; text-align: center; }
      .tag b { display: block; }
      .tag span { opacity: .7; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="panel"><b>Kit viewer</b> — <span id="count"></span><div id="toggles"></div><span style="opacity:.7">keys: 1–7 toggle · L labels</span></div>
    <script type="module" src="/src/kit.js"></script>
  </body>
</html>
