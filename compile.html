<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cel Town — compiler</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; font: 12px/1.45 ui-sans-serif, system-ui, sans-serif; color: #22333b; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #panel { position: fixed; left: 12px; top: 12px; width: 240px; background: rgba(255,255,255,0.88); border: 2px solid #22333b; border-radius: 10px; padding: 9px 12px; box-shadow: 3px 3px 0 rgba(34,51,59,.25); }
      #panel h1 { font-size: 13px; margin-bottom: 4px; }
      #panel .row { display: flex; justify-content: space-between; }
      #panel .chk { display: flex; justify-content: space-between; border-top: 1px solid #0001; padding: 1px 0; }
      #panel .chk.bad { color: #c0392b; }
      #panel .chk.ok { color: #2e7d32; }
      #panel .chk.warn { color: #b08900; }
      #panel .muted { opacity: .65; }
      #panel .bar { margin: 6px 0; display: flex; gap: 6px; align-items: center; }
      #panel button { font: inherit; border: 2px solid #22333b; background: #fff; border-radius: 7px; padding: 2px 8px; cursor: pointer; box-shadow: 2px 2px 0 rgba(34,51,59,.25); }
      #panel label { cursor: pointer; }
      #verdict { font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="panel">
      <h1>Cel Town — compiler</h1>
      <div class="row"><span class="muted">spec</span><span id="spec"></span></div>
      <div class="row"><span class="muted">seed</span><span id="seed"></span></div>
      <div class="row"><span class="muted">attempt</span><span id="attempt"></span></div>
      <div class="row"><span class="muted">verdict</span><span id="verdict"></span></div>
      <div class="bar">
        <button id="new">New seed</button>
        <label><input type="checkbox" id="anchors" /> debug anchors</label>
      </div>
      <div id="checks"></div>
    </div>
    <script type="module" src="/src/compile-page.js"></script>
  </body>
</html>
